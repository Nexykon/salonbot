<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prijava — FlowTiq</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
  :root {
    --cream: #FBF8F1; --cream-2: #F4EDE4; --ink: #101E2B; --muted: #5A6875;
    --line: #E3D9CB; --green: #16A34A; --green-dark: #0E7A38; --rust: #B4442E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--cream); color: var(--ink);
    font-family: 'Fira Sans', system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .kartica {
    width: 100%; max-width: 440px; background: #fff;
    border: 2px solid var(--ink); border-radius: 18px;
    box-shadow: 6px 6px 0 var(--ink); padding: 30px 26px;
  }
  .logo { display: block; margin: 0 auto 18px; height: 38px; }
  h1 { margin: 0 0 6px; font-size: 22px; line-height: 1.2; text-align: center; }
  .pod { margin: 0 0 20px; font-size: 14px; line-height: 1.55; color: var(--muted); text-align: center; }
  label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 13px; font: inherit; font-size: 15px;
    background: var(--cream-2); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 12px; outline: none;
  }
  input:focus { border-color: var(--green-dark); }
  .polje { margin-bottom: 14px; }
  .namig { margin-top: 6px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  button {
    width: 100%; margin-top: 6px; padding: 13px 16px; font: inherit; font-size: 15px; font-weight: 700;
    background: var(--green); color: #fff; border: 2px solid var(--ink); border-radius: 12px;
    box-shadow: 3px 3px 0 var(--ink); cursor: pointer;
  }
  button:hover { background: var(--green-dark); }
  button:disabled { opacity: .6; cursor: default; box-shadow: none; }
  .sporocilo {
    margin-top: 16px; padding: 12px 14px; border: 2px solid var(--ink); border-radius: 12px;
    font-size: 14px; line-height: 1.55; display: none;
  }
  .sporocilo.ok { background: rgba(22,163,74,.10); }
  .sporocilo.napaka { background: rgba(180,68,46,.10); color: var(--rust); }
  .nazaj { margin-top: 20px; padding-top: 16px; border-top: 2px solid var(--line); text-align: center; }
  .nazaj a { color: var(--muted); font-size: 13.5px; font-weight: 600; text-decoration: none; }
  .nazaj a:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="kartica">
  <a href="/" title="FlowTiq — domača stran"><img class="logo" src="/ft-logo.png" alt="FlowTiq"></a>

  <h1>Prijava</h1>
  <p class="pod">Ena prijava za vse — sistem sam odpre pravo ploščo.</p>

  <div class="polje">
    <label for="email">E-naslov</label>
    <input type="email" id="email" placeholder="ana@lokal.si" autocomplete="username" autofocus>
  </div>
  <div class="polje">
    <label for="geslo">Geslo</label>
    <input type="password" id="geslo" placeholder="Vaše geslo" autocomplete="current-password">
    <div class="namig">E-naslov in geslo sta ločena od WhatsApp številke bota. Prejeli ste ju ob registraciji.</div>
  </div>
  <button id="gumb-geslo" onclick="prijavaZGeslom()">Vstopi</button>

  <div class="sporocilo" id="sporocilo"></div>

  <div class="nazaj">
    <a href="/geslo">Ste pozabili geslo?</a>
  </div>
  <div class="nazaj" style="border-top:0;padding-top:6px;margin-top:6px">
    <a href="/voznik">🛵 Ste voznik? Prijava za voznike →</a>
  </div>
  <div class="nazaj" style="border-top:0;padding-top:0;margin-top:2px">
    <a href="/registracija.html">Še niste v FlowTiq? Registracija →</a>
  </div>
</div>

<script>
/*
  Ena prijavna stran za vse tri plošče.

  Vpis je samo z e-naslovom in geslom. Vloge ne ugotavlja ta stran, ampak
  strežnik: /api/auth/login vrne role in salon.booking_mode,
  /api/auth/master-login pa role "master". Tu se samo odloči, kam poslati
  uporabnika in kateri ključ zapisati v shrambo.

  Žeton NE gre v naslov. Prej je salon.html preusmerjal na
  /delivery.html?token=…, ker je tista plošča brala drug ključ; zato tu
  zapišemo oba ključa, ki jih lastniški plošči poznata.
*/
var params = new URLSearchParams(location.search);

// Stara povezava iz Stripa (preklic plačila) je kazala na to stran, ko je bila
// še registracija. Da tak obiskovalec ne pristane na prijavi, ga pošljemo tja,
// kjer je obrazec zdaj.
if (params.get('billing')) {
  location.replace('/registracija.html' + location.search);
}

// Kam po prijavi, če je plošča poslala uporabnika sem (?nazaj=/delivery.html…).
// Dovoljene so samo poti do naših plošč — brez tega bi bila to odprta
// preusmeritev na tuje strani.
var DOVOLJENE = ['/salon.html', '/delivery.html', '/admin.html'];
function zeljenaPot(vloga) {
  var n = params.get('nazaj') || '';
  if (!n || n.charAt(0) !== '/' || n.charAt(1) === '/') return null;
  var pot = n.split('?')[0];
  if (DOVOLJENE.indexOf(pot) < 0) return null;
  if (vloga === 'master' && pot !== '/admin.html') return null;
  if (vloga !== 'master' && pot === '/admin.html') return null;
  return n;
}

function povej(besedilo, jeNapaka) {
  var el = document.getElementById('sporocilo');
  el.textContent = besedilo;
  el.className = 'sporocilo ' + (jeNapaka ? 'napaka' : 'ok');
  el.style.display = 'block';
}

function shrani(kljuc, zeton) {
  try { sessionStorage.setItem(kljuc, zeton); } catch (_e) {}
  try { localStorage.setItem(kljuc, zeton); } catch (_e) {}
}

// Kam po uspešni prijavi.
function vstopi(d) {
  if (d.role === 'master') {
    shrani('ft_master_token', d.token);
    location.href = zeljenaPot('master') || '/admin.html';
    return;
  }
  shrani('ft_owner_token', d.token);
  var s = d.salon || {};
  // Isto pravilo kot na strežniku (server.js:2443), da se plošči ujemata.
  var jeLokal = s.booking_mode === 'delivery' || s.business_type === 'restaurant';
  if (jeLokal) shrani('ft_delivery_token', d.token);   // ključ, ki ga bere delivery.html
  location.href = zeljenaPot('owner') || (jeLokal ? '/delivery.html' : '/salon.html');
}

async function prijavaZGeslom() {
  var email = document.getElementById('email').value.trim();
  var geslo = document.getElementById('geslo').value;
  if (!email || email.indexOf('@') < 0) { povej('Vpišite veljaven e-naslov.', true); return; }
  if (!geslo) { povej('Vpišite geslo.', true); return; }
  var gumb = document.getElementById('gumb-geslo');
  gumb.disabled = true; gumb.textContent = 'Prijavljam…';
  try {
    var telo = JSON.stringify({ email: email, password: geslo });
    var glave = { 'Content-Type': 'application/json' };
    // Najprej lastnik, nato skrbnik. Prej je bil e-naslov skrbnika zapisan v
    // kodi strani, da se je izbral vnaprej — tega ni več treba.
    var r = await fetch('/api/auth/login', { method: 'POST', headers: glave, body: telo });
    var d = await r.json().catch(function () { return {}; });
    if (!r.ok) {
      var rm = await fetch('/api/auth/master-login', { method: 'POST', headers: glave, body: telo });
      var dm = await rm.json().catch(function () { return {}; });
      if (rm.ok) { vstopi(dm); return; }
      povej(d.error || dm.error || 'Napačen e-naslov ali geslo.', true);
      return;
    }
    vstopi(d);
  } catch (e) {
    povej('Povezava s strežnikom ni uspela. Poskusite pozneje.', true);
  } finally {
    gumb.disabled = false; gumb.textContent = 'Vstopi';
  }
}

// Enter v obeh poljih pomeni prijavo.
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') prijavaZGeslom();
});
</script>
</body>
</html>
