<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF8F1">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<title>FlowTiq — Voznik</title>
<link rel="canonical" href="https://flowtiq.si/voznik.html">
<meta property="og:url" content="https://flowtiq.si/voznik.html">
<meta name="description" content="Prijava za voznike: seznam naročil za dostavo z naslovi, telefoni in potrditvijo dostave. Dostop z imenom lokala in PIN kodo.">
<meta property="og:title" content="FlowTiq — Voznik">
<meta property="og:description" content="Prijava za voznike: seznam naročil za dostavo z naslovi, telefoni in potrditvijo dostave. Dostop z imenom lokala in PIN kodo.">
<meta property="og:type" content="website">
<meta property="og:locale" content="sl_SI">
<meta property="og:image" content="https://flowtiq.si/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="FlowTiq — naročila in termini na avtopilotu">
<meta property="og:site_name" content="FlowTiq">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&family=Fira+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* ─────────────────────────────────────────────────────────────
     FlowTiq — voznik. Isti design kot prijava v salon.html.
     Imena razredov so nespremenjena: render() jih zapisuje
     v innerHTML (.order, .ref, .name, .addr, .meta, .total,
     .phone, .deliver, .badge, .empty).
     ───────────────────────────────────────────────────────────── */
  :root {
    --ink: #101E2B;
    --ink-2: #2B3A47;
    --muted: #5A6875;
    --cream: #FBF8F1;
    --cream-2: #F4EDE4;
    --tan: #EDE4D6;
    --green: #16A34A;
    --green-dark: #0E7A38;
    --green-tint: #E8F5EC;
    --blue: #1D6FD0;
    --red: #B4442E;
    --red-bg: #FBEEEB;
    --line: #E4DCCB;
    --dash: #C9C0AE;
    --white: #fff;
    --radius: 18px;
    --sans: "Fira Sans", system-ui, -apple-system, Segoe UI, sans-serif;
    --mono: "Fira Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--cream);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
  /* legacy razred — nekoč gradient, zdaj polna zelena */
  .grad { background: var(--green); }
  .disp { font-family: var(--sans); font-weight: 800; letter-spacing: -0.02em; }
  /* JS preklaplja .hidden na .login in #appView; !important, da ne izgubi
     proti .login{display:flex} ne glede na vrstni red pravil. */
  .hidden { display: none !important; }
  :focus-visible { outline: 3px solid rgba(22,163,74,.45); outline-offset: 2px; }

  /* ── Prijava — enako kot salon.html ── */
  .login {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; background: linear-gradient(var(--cream), var(--cream-2));
  }
  .card {
    background: var(--white); border: 2px solid var(--ink); border-radius: var(--radius);
    box-shadow: 7px 7px 0 var(--ink);
    padding: 32px 28px; width: 100%; max-width: 400px;
  }
  .brand { display: flex; justify-content: center; margin-bottom: 10px; }
  .brand img { height: 34px; width: auto; object-fit: contain; }
  .role {
    font-family: var(--sans); text-align: center; font-size: 1.55rem;
    font-weight: 800; letter-spacing: -0.02em; margin: 8px 0 2px; color: var(--ink);
  }
  .sub { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 7px; }
  input {
    width: 100%; padding: 13px 14px;
    border: 2px solid var(--ink); border-radius: var(--radius);
    font-family: inherit; font-size: 16px; outline: none; background: var(--white); color: var(--ink);
  }
  input::placeholder { color: #93A0AC; }
  input:focus { outline: 3px solid rgba(22,163,74,.35); outline-offset: 1px; }
  #pin {
    font-family: var(--mono); letter-spacing: 10px; text-align: center;
    font-size: 22px; font-weight: 700;
  }
  .btn {
    width: 100%; border: 2px solid var(--ink); border-radius: var(--radius);
    padding: 14px; font-family: inherit; font-size: 16px; font-weight: 600;
    color: #fff; cursor: pointer; margin-top: 20px;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform .12s, box-shadow .12s, background .15s;
  }
  .btn:hover { background: var(--green-dark); }
  .btn:active { box-shadow: 1px 1px 0 var(--ink); transform: translate(3px, 3px); }
  .btn.grad:disabled { opacity: .55; box-shadow: 4px 4px 0 var(--ink); transform: none; }
  .err {
    background: var(--red-bg); color: #8A3421;
    border: 2px solid var(--red); border-radius: 14px;
    padding: 11px 13px; font-size: 14px; margin-top: 14px; display: none;
  }
  .home {
    display: block; text-align: center; margin-top: 18px;
    color: var(--muted); font-size: 13px; font-weight: 600; text-decoration: none;
  }
  .home:hover { color: var(--ink); }

  /* ── Glava seznama ── */
  .topbar {
    position: sticky; top: 0; z-index: 5; color: #fff;
    /* enaka širina kot .wrap, da je na namizju poravnan s karticami */
    max-width: 640px; margin: 0 auto;
    padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; border-bottom: 2px solid var(--ink);
  }
  .topbar .who { font-size: 13px; opacity: .95; }
  .topbar .loc { font-family: var(--sans); font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  .logout {
    background: var(--white); border: 2px solid var(--ink); color: var(--ink);
    font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 8px 13px; border-radius: 12px; cursor: pointer; flex-shrink: 0;
  }
  .logout:hover { background: var(--tan); }

  .search { position: sticky; top: 0; z-index: 4; background: var(--cream); padding: 12px 0; }
  .search input { background: var(--white); }

  .tabs { display: flex; gap: 8px; margin: 0 0 14px; }
  .tab {
    flex: 1; text-align: center; padding: 11px;
    border-radius: 14px; background: var(--white); border: 2px solid var(--ink);
    font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer;
  }
  .tab:hover { background: var(--tan); }
  .tab.on { background: var(--ink); color: var(--cream); }

  /* ── Naročila ── */
  .order {
    background: var(--white); border: 2px solid var(--ink); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px;
  }
  .order.done { opacity: .7; }
  .row1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .ref {
    font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--ink);
    background: var(--cream-2); border: 1.5px solid var(--ink);
    padding: 3px 9px; border-radius: 999px;
  }
  .name { font-family: var(--sans); font-size: 17px; font-weight: 800; letter-spacing: -0.01em; margin: 8px 0 2px; }
  .addr { font-size: 15px; color: var(--ink); font-weight: 600; }
  .addr a { color: var(--blue); text-decoration: none; border-bottom: 2px solid rgba(29,111,208,.35); }
  .addr a:hover { border-bottom-color: var(--blue); }
  .meta { font-size: 14px; color: var(--muted); margin-top: 8px; line-height: 1.5; white-space: pre-wrap; }
  .total { font-family: var(--sans); font-weight: 800; color: var(--green-dark); font-size: 16px; }
  .phone {
    display: inline-block; margin-top: 10px; color: var(--blue);
    font-weight: 600; text-decoration: none; font-size: 15px;
    border-bottom: 2px solid rgba(29,111,208,.35);
  }
  .phone:hover { border-bottom-color: var(--blue); }
  .deliver {
    width: 100%; margin-top: 14px; background: var(--green); color: #fff;
    border: 2px solid var(--ink); border-radius: var(--radius); padding: 13px;
    font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform .12s, box-shadow .12s, background .15s;
  }
  .deliver:hover { background: var(--green-dark); }
  .deliver:active { box-shadow: 1px 1px 0 var(--ink); transform: translate(3px, 3px); }
  .deliver:disabled { opacity: .6; box-shadow: 4px 4px 0 var(--ink); transform: none; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--green-tint); color: var(--green-dark);
    border: 1.5px solid var(--ink);
    font-size: 13px; font-weight: 600; padding: 6px 11px; border-radius: 999px; margin-top: 12px;
  }
  .empty {
    text-align: center; color: var(--muted); padding: 44px 20px; font-size: 15px;
    border: 2px dashed var(--dash); border-radius: var(--radius);
  }
  .foot {
    text-align: center; color: var(--muted); font-family: var(--mono);
    font-size: 11.5px; letter-spacing: .04em; margin-top: 22px;
  }

  @media (max-width: 420px) {
    .card { padding: 26px 20px; box-shadow: 5px 5px 0 var(--ink); }
    .wrap { padding: 12px 12px 40px; }
    #pin { letter-spacing: 8px; }
  }
  /* logotip je povezava na domačo stran — inline-flex, da ne doda prostora pod sliko */
  .ft-logo-link { display: inline-flex; align-items: center; }
</style>
</head>
<body>

<!-- PRIJAVA -->
<div id="loginView" class="login">
  <form class="card" id="loginForm" onsubmit="doLogin(event)">
    <div class="brand"><a class="ft-logo-link" href="/" title="FlowTiq — domača stran"><img src="/ft-logo.png" width="188" height="55" alt="FlowTiq"></a></div>
    <h1 class="role">Voznik</h1>
    <div class="sub">Dostop do naročil za dostavo</div>
    <label for="lokal">Lokal</label>
    <input id="lokal" placeholder="npr. picerija-mars" autocomplete="off" required>
    <label for="pin">PIN koda</label>
    <input id="pin" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="••••" required>
    <button class="btn grad" id="loginBtn" type="submit">Prijava</button>
    <div class="err" id="loginErr"></div>
    <a class="home" href="/">← Nazaj na flowtiq.si</a>
  </form>
</div>

<!-- NAROČILA -->
<div id="appView" class="hidden">
  <div class="topbar grad">
    <div>
      <div class="who" id="whoLabel">Voznik</div>
      <div class="loc disp" id="locLabel">Lokal</div>
    </div>
    <button class="logout" onclick="logout()">Odjava</button>
  </div>
  <div class="wrap">
    <div class="search">
      <input id="searchBox" placeholder="🔍 Išči po imenu, naslovu, telefonu…" oninput="onSearch()">
    </div>
    <div class="tabs">
      <div class="tab on" id="tabActive" onclick="setTab('active')">Za dostavo</div>
      <div class="tab" id="tabDone" onclick="setTab('done')">Dostavljeno</div>
    </div>
    <div id="orders"></div>
    <div class="foot">Osveženo: <span id="refreshedAt">—</span> · osveži se samodejno</div>
  </div>
</div>

<script>
const API = '';
let token = localStorage.getItem('ft_driver_token') || '';
let driverName = localStorage.getItem('ft_driver_name') || '';
let salonName = localStorage.getItem('ft_driver_salon') || '';
let allOrders = [];
let tab = 'active';
let pollTimer = null;

// pre-fill lokal iz URL (?lokal=slug)
const urlLokal = new URLSearchParams(location.search).get('lokal');
if (urlLokal) document.getElementById('lokal').value = urlLokal;

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function doLogin(e){
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginErr');
  err.style.display='none';
  const lokal = document.getElementById('lokal').value.trim();
  const pin = document.getElementById('pin').value.trim();
  if(!/^\d{4}$/.test(pin)){ err.textContent='PIN mora imeti 4 številke.'; err.style.display='block'; return; }
  btn.disabled=true; btn.textContent='Prijavljam…';
  try{
    const r = await fetch(API+'/api/driver/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({salon:lokal,pin})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error||'Napaka pri prijavi');
    token=d.token; driverName=d.driver_name||'Voznik'; salonName=d.salon_name||lokal;
    localStorage.setItem('ft_driver_token',token);
    localStorage.setItem('ft_driver_name',driverName);
    localStorage.setItem('ft_driver_salon',salonName);
    localStorage.setItem('ft_driver_lokal',lokal);
    enterApp();
  }catch(ex){ err.textContent=ex.message; err.style.display='block'; }
  finally{ btn.disabled=false; btn.textContent='Prijava'; }
}

function logout(){
  token=''; localStorage.removeItem('ft_driver_token');
  if(pollTimer) clearInterval(pollTimer);
  document.getElementById('appView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('pin').value='';
}

function enterApp(){
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('whoLabel').textContent = '👤 '+driverName;
  document.getElementById('locLabel').textContent = salonName;
  loadOrders();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(loadOrders, 25000);
}

async function loadOrders(){
  if(!token) return;
  const q = document.getElementById('searchBox').value.trim();
  try{
    const r = await fetch(API+'/api/driver/orders'+(q?('?search='+encodeURIComponent(q)):''),
      {headers:{'Authorization':'Bearer '+token}});
    if(r.status===401){ logout(); return; }
    const d = await r.json();
    allOrders = d.orders||[];
    render();
    document.getElementById('refreshedAt').textContent =
      new Date().toLocaleTimeString('sl-SI',{hour:'2-digit',minute:'2-digit'});
  }catch(ex){ /* tiho — ponovni poskus ob naslednjem ciklu */ }
}

let searchDebounce=null;
function onSearch(){ clearTimeout(searchDebounce); searchDebounce=setTimeout(loadOrders,350); }

function setTab(t){
  tab=t;
  document.getElementById('tabActive').classList.toggle('on',t==='active');
  document.getElementById('tabDone').classList.toggle('on',t==='done');
  render();
}

function mapsLink(addr){
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr);
}

function render(){
  const box = document.getElementById('orders');
  const list = allOrders.filter(o => tab==='active' ? o.status!=='delivered' : o.status==='delivered');
  if(!list.length){
    box.innerHTML = '<div class="empty">'+(tab==='active'
      ? '📭 Trenutno ni naročil za dostavo.' : 'Ni dostavljenih naročil.')+'</div>';
    return;
  }
  box.innerHTML = list.map(o=>{
    const done = o.status==='delivered';
    const addr = o.address && o.address!=='Osebni prevzem'
      ? '<div class="addr">📍 <a href="'+mapsLink(o.address)+'" target="_blank" rel="noopener">'+esc(o.address)+'</a></div>' : '';
    const phone = o.phone ? '<a class="phone" href="tel:'+esc(o.phone)+'">📞 '+esc(o.phone)+'</a>' : '';
    const items = o.items ? '<div class="meta">🍕 '+esc(o.items)+'</div>' : '';
    const pay = o.payment ? '<div class="meta" style="font-weight:700;color:var(--ink)">💳 Plačilo: '+esc(o.payment)+'</div>' : '';
    const note = o.note ? '<div class="meta">📝 '+esc(o.note)+'</div>' : '';
    const total = o.total ? '<span class="total">'+esc(o.total)+'</span>' : '';
    const action = done
      ? '<div class="badge">✅ Dostavil: '+esc(o.delivered_by||'—')+
          (o.delivered_at?(' · '+new Date(o.delivered_at).toLocaleTimeString('sl-SI',{hour:'2-digit',minute:'2-digit'})):'')+'</div>'
      : '<button class="deliver" onclick="confirmDeliver(\''+o.id+'\',this)">✅ Potrdi dostavo</button>';
    return '<div class="order'+(done?' done':'')+'">'
      + '<div class="row1"><div class="ref">#'+esc(o.ref)+'</div>'+total+'</div>'
      + '<div class="name">'+esc(o.name||'Stranka')+'</div>'
      + addr + items + pay + note + phone + action + '</div>';
  }).join('');
}

async function confirmDeliver(id, btn){
  if(!confirm('Potrdi, da je naročilo dostavljeno?')) return;
  btn.disabled=true; btn.textContent='Shranjujem…';
  try{
    const r = await fetch(API+'/api/driver/orders/'+id+'/delivered',
      {method:'PATCH',headers:{'Authorization':'Bearer '+token}});
    if(r.status===401){ logout(); return; }
    const d = await r.json();
    if(!r.ok) throw new Error(d.error||'Napaka');
    const o = allOrders.find(x=>x.id===id);
    if(o){ o.status='delivered'; o.delivered_by=d.delivered_by; o.delivered_at=d.delivered_at; }
    render();
  }catch(ex){ alert(ex.message); btn.disabled=false; btn.textContent='✅ Potrdi dostavo'; }
}

// auto-login če je žeton shranjen
if(token){ enterApp(); }
</script>
</body>
</html>
